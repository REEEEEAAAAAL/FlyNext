name: ${COMPOSE_PROJECT_NAME:?Create .env.docker.local first}

services:
  nextjs:
    build:
      context: .
      dockerfile: dockerfile
    image: ${COMPOSE_PROJECT_NAME}-app:local
    init: true
    command: ["node", "scripts/docker/start.mjs"]
    ports:
      - "127.0.0.1:${FLYNEXT_DOCKER_PORT:-3300}:3000"
    environment:
      DATABASE_URL: postgresql://flynext_docker:${FLYNEXT_DOCKER_PASSWORD:?Create .env.docker.local first}@postgres:5432/flynext_docker_demo?connection_limit=1&connect_timeout=5
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      FLYNEXT_DOCKER_INSTANCE_ID: ${FLYNEXT_DOCKER_INSTANCE_ID:?Create .env.docker.local first}
      JWT_ACCESS_SECRET: ${FLYNEXT_DOCKER_ACCESS_SECRET:?Create .env.docker.local first}
      JWT_REFRESH_SECRET: ${FLYNEXT_DOCKER_REFRESH_SECRET:?Create .env.docker.local first}
      JWT_ACCESS_TOKEN_EXPIRY_TIME: 15m
      JWT_REFRESH_TOKEN_EXPIRY_TIME: 7d
      AFS_BASE_URL: ""
      AFS_MOCK: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - uploads-volume:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/docker/health.mjs"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Local Advanced Flights System (AFS) — optional.
  #
  # This service runs the upstream project (https://github.com/Kianoosh76/afs)
  # from source, with its own PostgreSQL database and a generated schedule, so
  # the flight search, booking and refund flows work against a real provider.
  #
  # Behind a profile, so a plain `docker compose up` starts only the FlyNext
  # stack and the built-in offline provider remains the default:
  #
  #   docker compose --profile afs up -d
  #
  # The API key it accepts is the sha-256 of AFS_LOCAL_AGENCY; the same value has
  # to be in AFS_API_KEY. See .env.example.
  # ---------------------------------------------------------------------------
  afs:
    profiles: ["afs"]
    build:
      context: .
      dockerfile: dockerfile.afs
    ports:
      - "4000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-flynextdb_owner}:${FLYNEXT_DOCKER_PASSWORD:?Create .env.docker.local first}@afs-postgres:5432/afsdb
      - AFS_LOCAL_AGENCY=${AFS_LOCAL_AGENCY:-flynext-local}
      - AFS_SEED_DAYS=${AFS_SEED_DAYS:-7}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      afs-postgres:
        condition: service_healthy
    restart: always

  afs-postgres:
    profiles: ["afs"]
    image: postgres:15-alpine
    # No published port: the AFS database is only reachable from the compose
    # network, which keeps it from colliding with the FlyNext database on 5432.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-flynextdb_owner}
      - POSTGRES_PASSWORD=${FLYNEXT_DOCKER_PASSWORD:?Create .env.docker.local first}
      - POSTGRES_DB=afsdb
    volumes:
      - afs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flynextdb_owner} -d afsdb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: flynext_bootstrap
      POSTGRES_PASSWORD: ${FLYNEXT_DOCKER_ADMIN_PASSWORD:?Create .env.docker.local first}
      POSTGRES_DB: flynext_docker_demo
      FLYNEXT_DOCKER_PASSWORD: ${FLYNEXT_DOCKER_PASSWORD}
      FLYNEXT_DOCKER_INSTANCE_ID: ${FLYNEXT_DOCKER_INSTANCE_ID}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-flynext.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flynext_bootstrap -d flynext_docker_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads-volume:
  afs_postgres_data:
