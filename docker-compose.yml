name: ${COMPOSE_PROJECT_NAME:?Create .env.docker.local first}

services:
  nextjs:
    build:
      context: .
      dockerfile: dockerfile
    image: ${COMPOSE_PROJECT_NAME}-app:local
    init: true
    command: ["node", "scripts/docker/start.mjs"]
    ports:
      - "127.0.0.1:${FLYNEXT_DOCKER_PORT:-3300}:3000"
    environment:
      DATABASE_URL: postgresql://flynext_docker:${FLYNEXT_DOCKER_PASSWORD:?Create .env.docker.local first}@postgres:5432/flynext_docker_demo?connection_limit=1&connect_timeout=5
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      FLYNEXT_DOCKER_INSTANCE_ID: ${FLYNEXT_DOCKER_INSTANCE_ID:?Create .env.docker.local first}
      JWT_ACCESS_SECRET: ${FLYNEXT_DOCKER_ACCESS_SECRET:?Create .env.docker.local first}
      JWT_REFRESH_SECRET: ${FLYNEXT_DOCKER_REFRESH_SECRET:?Create .env.docker.local first}
      JWT_ACCESS_TOKEN_EXPIRY_TIME: 15m
      JWT_REFRESH_TOKEN_EXPIRY_TIME: 7d
      AFS_BASE_URL: ""
      AFS_MOCK: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - uploads-volume:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/docker/health.mjs"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  # Optional provider services require the afs profile.
  afs:
    profiles: ["afs"]
    build:
      context: .
      dockerfile: dockerfile.afs
    image: ${COMPOSE_PROJECT_NAME}-afs:local
    init: true
    environment:
      DATABASE_URL: postgresql://afs_docker:${AFS_DOCKER_PASSWORD:-unconfigured}@afs-postgres:5432/afs_docker_demo?connection_limit=1&connect_timeout=5
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      AFS_DOCKER_INSTANCE_ID: ${AFS_DOCKER_INSTANCE_ID:-unconfigured}
      AFS_LOCAL_API_KEY: ${AFS_LOCAL_API_KEY:-unconfigured}
      AFS_LOCAL_AGENCY: ${AFS_LOCAL_AGENCY:-flynext-local}
      AFS_SEED_DAYS: ${AFS_SEED_DAYS:-14}
    depends_on:
      afs-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "afs/health.mjs"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  afs-postgres:
    profiles: ["afs"]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: afs_bootstrap
      POSTGRES_PASSWORD: ${AFS_DOCKER_ADMIN_PASSWORD:-unconfigured}
      POSTGRES_DB: afs_docker_demo
      AFS_DOCKER_PASSWORD: ${AFS_DOCKER_PASSWORD:-unconfigured}
      AFS_DOCKER_INSTANCE_ID: ${AFS_DOCKER_INSTANCE_ID:-unconfigured}
    volumes:
      - afs_postgres_data:/var/lib/postgresql/data
      - ./afs/postgres-init.sh:/docker-entrypoint-initdb.d/10-afs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afs_bootstrap -d afs_docker_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: flynext_bootstrap
      POSTGRES_PASSWORD: ${FLYNEXT_DOCKER_ADMIN_PASSWORD:?Create .env.docker.local first}
      POSTGRES_DB: flynext_docker_demo
      FLYNEXT_DOCKER_PASSWORD: ${FLYNEXT_DOCKER_PASSWORD}
      FLYNEXT_DOCKER_INSTANCE_ID: ${FLYNEXT_DOCKER_INSTANCE_ID}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-flynext.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flynext_bootstrap -d flynext_docker_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads-volume:
  afs_postgres_data:
